# Dependabot configuration
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates

version: 2
updates:
  # Frontend dependencies (root package.json)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    groups:
      # Keep the test runner and its exact-peer coverage provider together.
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
      # Group minor/patch updates to reduce PR noise
      production-dependencies:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      development-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Tailwind v4 is a breaking rewrite requiring manual migration
      - dependency-name: "tailwindcss"
        versions: [">=4.0.0"]
    commit-message:
      prefix: "deps"

  # Backend/server dependencies
  - package-ecosystem: "npm"
    directory: "/server"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      # Keep the test runner and its exact-peer coverage provider together.
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
      server-dependencies:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # These series require a coordinated SDK 3/API 1.10/Node >=22 migration.
      # Keep Node 20 Docker support and compatible telemetry patch updates here.
      - dependency-name: "@opentelemetry/auto-instrumentations-node"
        versions: ["0.82.x"]
      - dependency-name: "@opentelemetry/exporter-trace-otlp-http"
        versions: ["0.300.x"]
      - dependency-name: "@opentelemetry/sdk-node"
        versions: ["0.300.x"]
      - dependency-name: "@opentelemetry/resources"
        versions: ["3.x"]
    commit-message:
      prefix: "deps(server)"
    labels:
      - "backend"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    labels:
      - "ci"
